server.port=${SERVER_PORT:8080}
spring.application.name=Multi_reward
# 数据库/中间件均可用环境变量覆盖(本地默认值见 .env.example;部署时注入真实值)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/multi_reward
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
mybatis.mapper-locations=classpath:mapper/*.xml

spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.consumer.group-id=sync-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false

spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}
# PrizeCenter 地址(发奖/流水核对;部署时外部化覆盖)

# Stable discovery identity; retain the existing Spring application name.
eureka.client.enabled=${DISCOVERY_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.appname=reward-service
eureka.instance.virtual-host-name=reward-service
eureka.instance.secure-virtual-host-name=reward-service
eureka.instance.instance-id=${SERVICE_INSTANCE_ID:reward-service:${spring.cloud.client.hostname}:${server.port}}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${SERVICE_HOSTNAME:${spring.cloud.client.hostname}}
eureka.instance.ip-address=${SERVICE_IP_ADDRESS:${spring.cloud.client.ip-address}}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Eureka already caches instances. Avoid a second stale-instance cache.
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.loadbalancer.retry.enabled=false

# No HTTP retries. Keep these bounds below the upstream request budget.
integration.http.connect-timeout-ms=${INTERNAL_CONNECT_TIMEOUT_MS:1000}
integration.http.read-timeout-ms=${INTERNAL_READ_TIMEOUT_MS:3000}

# Preserve existing REDIS_* / spring.redis.* settings for Boot auto-configuration.
spring.data.redis.host=${spring.redis.host}
spring.data.redis.port=${spring.redis.port}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${spring.redis.database:0}

reward.reconciliation.enabled=${RECONCILIATION_ENABLED:true}

# Registry outages must not make an otherwise healthy cached-discovery client DOWN.
spring.cloud.discovery.client.health-indicator.enabled=false

# Bound registry transport calls independently from business HTTP calls (milliseconds).
eureka.client.rest-template-timeout.connect-timeout=2000
eureka.client.rest-template-timeout.connect-request-timeout=2000
eureka.client.rest-template-timeout.socket-timeout=3000
eureka.client.restclient.timeout.connect-timeout=2000
eureka.client.restclient.timeout.connect-request-timeout=2000
eureka.client.restclient.timeout.socket-timeout=3000

# Feign uses the discovery name unless a direct profile URL is explicitly configured.
# Pin the JDK transport; keep external SDK transports independent.
spring.cloud.openfeign.httpclient.hc5.enabled=false
spring.cloud.openfeign.okhttp.enabled=false
spring.cloud.openfeign.http2client.enabled=false

# Seata AT: both services must use the same transaction group and coordinator.
seata.enabled=${SEATA_ENABLED:true}
seata.application-id=${eureka.instance.appname}
seata.tx-service-group=reward_tx_group
seata.enable-auto-data-source-proxy=true
seata.data-source-proxy-mode=AT
seata.config.type=file
seata.registry.type=file
seata.service.vgroup-mapping.reward_tx_group=default
seata.service.grouplist.default=${SEATA_SERVER_ADDR:127.0.0.1:18091}
# Never silently downgrade an award to a local transaction if the TC is unavailable.
seata.client.tm.degrade-check=false
seata.client.undo.log-serialization=jackson
# Bind inbound XIDs only on Prize's internal award endpoint, not on public Reward endpoints.
spring.autoconfigure.exclude=org.apache.seata.spring.boot.autoconfigure.SeataHttpAutoConfiguration
