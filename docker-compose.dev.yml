# Local-development middleware only.
# The Spring services and frontend run on the host for fast rebuilds/debugging.
# Production continues to use docker-compose.yml and real Amazon S3.
name: reward-project-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-reward-local-password}
    ports:
      - "127.0.0.1:${DB_PORT:-13306}:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-dev-data:/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is used inside this Compose network; EXTERNAL is advertised to
      # the Spring processes running directly on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:9092"
    volumes:
      - kafka-dev-data:/var/lib/kafka/data
    restart: unless-stopped

  minio:
    # MinIO is used only as a localhost-bound S3-compatible development
    # service. The application itself continues to use the AWS SDK.
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-rewardlocal}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-reward-local-secret}
    ports:
      - "127.0.0.1:${S3_LOCAL_PORT:-19000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-dev-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-rewardlocal}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-reward-local-secret}
      S3_BUCKET: ${S3_BUCKET:-music}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET\" &&
      echo 'Local S3 bucket is ready'"
    restart: "no"

volumes:
  mysql-dev-data:
  redis-dev-data:
  kafka-dev-data:
  minio-dev-data:
