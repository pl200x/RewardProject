# RewardProject 一键部署:中间件(MySQL/Redis/Kafka) + 4 后端 + 前端 nginx。
# 用法:cp .env.example .env 填好变量 → docker compose up -d --build
# 只有前端端口对外发布;音频通过私有 S3 对象的短期预签名 URL 播放。
# 其余服务只在 compose 内网可达。详细步骤见 DEPLOY.md。

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表 + 导种子数据(01~06 按文件名顺序执行)
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  # Rerun this additive migration even when MySQL already has a data volume.
  seata-schema:
    image: mysql:8.4
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./sql/08_seata_undo_log.sql:/migration/08_seata_undo_log.sql:ro
    entrypoint: ["sh", "-c", "exec mysql -h mysql -uroot < /migration/08_seata_undo_log.sql"]
    restart: "no"

  seata-server:
    image: apache/seata-server:2.5.0.jdk17
    environment:
      SEATA_PORT: "8091"
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_MaxDirectMemorySize: 128m
      # JAVA_TOOL_OPTIONS breaks this image's java-version detection script.
      JAVA_OPT: "-XX:ActiveProcessorCount=2"
    volumes:
      - ./deploy/seata/application.yml:/seata-server/resources/application.yml:ro
      - seata-data:/seata-server/sessionStore
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/$$SEATA_PORT'"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    logging: *default-logging

  registry:
    build: ./service-registry
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m"
    restart: unless-stopped
    logging: *default-logging

  prize:
    build: ./PrizeCenter
    environment: &common-env
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://registry:8761/eureka/}
      EUREKA_PREFER_IP_ADDRESS: "true"
      SEATA_SERVER_ADDR: seata-server:8091
    depends_on:
      seata-server:
        condition: service_healthy
      seata-schema:
        condition: service_completed_successfully
      registry:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  reward:
    build: ./Multi_reward
    environment:
      <<: *common-env
      KAFKA_SERVERS: kafka:9092
    depends_on:
      seata-server:
        condition: service_healthy
      seata-schema:
        condition: service_completed_successfully
      registry:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      prize:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  music:
    build: ./Music_management
    environment:
      <<: *common-env
      KAFKA_SERVERS: kafka:9092
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置至少 32 字节的 JWT_SECRET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?请在 .env 里设置 S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-audio}
      # 本地 Docker 可使用临时 IAM 凭据;EC2 上保持为空,SDK 会读取实例 IAM Role。
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      registry:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  chatbot:
    build: ./ai_chatbot
    environment:
      <<: *common-env
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置至少 32 字节的 JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?请在 .env 里设置 OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.1}
      OPENAI_MAX_MESSAGE_SIZE: ${OPENAI_MAX_MESSAGE_SIZE:-16}
      ASSISTANT_TIME_ZONE: ${ASSISTANT_TIME_ZONE:-America/New_York}
    depends_on:
      registry:
        condition: service_started
      mysql:
        condition: service_healthy
      reward:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  web:
    build: ./frontend
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
    depends_on:
      - music
      - reward
      - prize
      - chatbot
    restart: unless-stopped
    logging: *default-logging

volumes:
  seata-data:
  mysql-data:
  kafka-data:
