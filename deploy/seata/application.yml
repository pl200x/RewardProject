server:
  port: ${SEATA_PORT:8091}
spring:
  application:
    name: seata-server
  main:
    web-application-type: none
logging:
  config: classpath:logback-spring.xml
  file:
    path: /seata-server/logs
seata:
  config:
    type: file
  registry:
    type: file
  server:
    service-port: ${SEATA_PORT:8091}
  store:
    mode: file
    file:
      dir: /seata-server/sessionStore
