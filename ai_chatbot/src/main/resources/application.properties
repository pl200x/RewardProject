spring.application.name=ai_chatbot

# IntelliJ direct runs do not source shell environment files. Import the local
# git-ignored .env when present; deployed environment variables still override it.
spring.config.import=optional:file:.env[.properties]

server.port=${CHATBOT_PORT:8083}
jwt.secret=${JWT_SECRET:}

# 连接 RewardProject Docker MySQL 在宿主机暴露的 13306 端口
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/ai_chatbot
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml

# Never place an API key in source control. Local runs load OPENAI_API_KEY from
# .env via scripts/start-local.sh; deployments inject it through the runtime.
# The non-secret fallback lets the Spring context load in isolated unit tests;
# start-local.sh rejects it before a real server is started.
spring.ai.openai.api-key=${OPENAI_API_KEY:test-key}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5.4-mini}
spring.ai.openai.chat.temperature=${OPENAI_TEMPERATURE:0.1}
spring.ai.openai.max-message-size=${OPENAI_MAX_MESSAGE_SIZE:16}

assistant-agent.max-iterations=10
assistant-agent.time-zone=${ASSISTANT_TIME_ZONE:America/New_York}

# Stable discovery identity; retain the existing Spring application name.
eureka.client.enabled=${DISCOVERY_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.appname=chatbot-service
eureka.instance.virtual-host-name=chatbot-service
eureka.instance.secure-virtual-host-name=chatbot-service
eureka.instance.instance-id=${SERVICE_INSTANCE_ID:chatbot-service:${spring.cloud.client.hostname}:${server.port}}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${SERVICE_HOSTNAME:${spring.cloud.client.hostname}}
eureka.instance.ip-address=${SERVICE_IP_ADDRESS:${spring.cloud.client.ip-address}}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Eureka already caches instances. Avoid a second stale-instance cache.
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.loadbalancer.retry.enabled=false

# No HTTP retries. Keep these bounds below the upstream request budget.
integration.http.connect-timeout-ms=${INTERNAL_CONNECT_TIMEOUT_MS:1000}
integration.http.read-timeout-ms=${INTERNAL_READ_TIMEOUT_MS:3000}

logging.pattern.level=%5p [svc:%X{service}] [instance:%X{instance}] [request:%X{traceId}]

# Registry outages must not make an otherwise healthy cached-discovery client DOWN.
spring.cloud.discovery.client.health-indicator.enabled=false

# Bound registry transport calls independently from business HTTP calls (milliseconds).
eureka.client.timeout.connect-timeout=2000
eureka.client.timeout.connect-request-timeout=2000
eureka.client.timeout.socket-timeout=3000

# Feign uses the discovery name unless a direct profile URL is explicitly configured.
# Pin the JDK transport; keep external SDK transports independent.
spring.cloud.openfeign.httpclient.hc5.enabled=false
spring.cloud.openfeign.okhttp.enabled=false
spring.cloud.openfeign.http2client.enabled=false
