server.port=8081
spring.application.name=Music_management
# 数据库/中间件均可用环境变量覆盖(本地默认值见 .env.example;部署时注入真实值)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/test
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml

spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.consumer.group-id=my-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false

spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# 通知邮件 SMTP(账号/授权码来自环境变量,不入库;未配置时发信会失败但不影响其他功能)
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Amazon S3(私有音乐音频):key = <prefix>/<title>.mp3
# 凭据不写在配置中。SDK 默认凭据链会读取本地 AWS profile/环境变量/EC2 IAM Role。
storage.s3.region=${AWS_REGION:us-east-1}
storage.s3.bucket=${S3_BUCKET:reward-project-music-not-configured}
storage.s3.prefix=${S3_PREFIX:audio}
# 仅供 LocalStack 等本地 S3 兼容服务使用;连接 AWS S3 时留空。
storage.s3.endpoint=${S3_ENDPOINT:}
storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}

# Multi_reward 地址(播放上报;部署时外部化覆盖)

# 前端站点地址:新歌通知邮件里的详情页直达链接用(部署时填浏览器可达的公网地址)
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# JWT HMAC-SHA256 密钥。Compose 部署会强制要求配置,本地裸跑保留开发默认值。
jwt.secret=${JWT_SECRET:}

# 上传音乐:multipart 上限(Spring 默认 1MB,不够放 mp3)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Stable discovery identity; retain the existing Spring application name.
eureka.client.enabled=${DISCOVERY_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.appname=music-service
eureka.instance.virtual-host-name=music-service
eureka.instance.secure-virtual-host-name=music-service
eureka.instance.instance-id=${SERVICE_INSTANCE_ID:music-service:${spring.cloud.client.hostname}:${server.port}}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.hostname=${SERVICE_HOSTNAME:${spring.cloud.client.hostname}}
eureka.instance.ip-address=${SERVICE_IP_ADDRESS:${spring.cloud.client.ip-address}}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Eureka already caches instances. Avoid a second stale-instance cache.
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.loadbalancer.retry.enabled=false

# No HTTP retries. Keep these bounds below the upstream request budget.
integration.http.connect-timeout-ms=${INTERNAL_CONNECT_TIMEOUT_MS:1000}
integration.http.read-timeout-ms=${INTERNAL_READ_TIMEOUT_MS:5000}

# Preserve existing REDIS_* / spring.redis.* settings for Boot auto-configuration.
spring.data.redis.host=${spring.redis.host}
spring.data.redis.port=${spring.redis.port}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${spring.redis.database:0}

# Registry outages must not make an otherwise healthy cached-discovery client DOWN.
spring.cloud.discovery.client.health-indicator.enabled=false

# SMTP is optional and must not remove music instances from routing.
management.health.mail.enabled=false

# Bound registry transport calls independently from business HTTP calls (milliseconds).
eureka.client.rest-template-timeout.connect-timeout=2000
eureka.client.rest-template-timeout.connect-request-timeout=2000
eureka.client.rest-template-timeout.socket-timeout=3000
eureka.client.restclient.timeout.connect-timeout=2000
eureka.client.restclient.timeout.connect-request-timeout=2000
eureka.client.restclient.timeout.socket-timeout=3000

# Feign uses the discovery name unless a direct profile URL is explicitly configured.
# Pin the JDK transport; keep external SDK transports independent.
spring.cloud.openfeign.httpclient.hc5.enabled=false
spring.cloud.openfeign.okhttp.enabled=false
spring.cloud.openfeign.http2client.enabled=false
