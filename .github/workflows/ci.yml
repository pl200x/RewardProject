name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Verify backend, Seata transactions and real multi-instance services
        run: ./scripts/verify-discovery.sh --full
