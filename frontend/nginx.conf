# 限制高成本 AI 请求。每个来源 IP 平均每分钟 10 次,允许短时突发 5 次。
limit_req_zone $binary_remote_addr zone=chatbot_rate:10m rate=10r/m;

# 生产版路由:与 vite.config.ts 的开发代理一一对应(前缀剥掉后转发)。
server {
    listen 80;
    server_name _;

    # 上传音乐 mp3 走 /api/music,放宽默认 1m 限制(与后端 multipart 30MB 对齐)
    client_max_body_size 30m;

    location /api/music/ {
        proxy_pass http://music:8081/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/reward/ {
        proxy_pass http://reward:8080/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/prize/ {
        proxy_pass http://prize:8082/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # 公网只开放聊天入口;上下文 CRUD 仍仅供容器内调试/未来受控功能使用。
    location = /api/chatbot/chat {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        limit_req zone=chatbot_rate burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://chatbot:8083/chatbot/chat;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # SPA:非文件路径全部回落 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
